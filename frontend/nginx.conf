# IP real del cliente: detrás de Cloudflare Tunnel llega en CF-Connecting-IP
map $http_cf_connecting_ip $client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 300m;

  location = /healthz { access_log off; return 200 "ok"; }

  # Progreso en tiempo real (SSE): sin búfer y con timeout largo
  location = /api/training/stream {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_request_buffering on;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Permissions-Policy "camera=(self), microphone=(self)";  # cámara/micrófono en vivo de «Probar» (sólo este sitio)
    add_header Referrer-Policy same-origin;
    # Todo se sirve desde este mismo origen (no hay CDN ni fuentes externas); 'unsafe-inline' sólo por el script del
    # tema en index.html y los estilos en línea de Tailwind/Recharts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    try_files $uri /index.html;
  }
}
